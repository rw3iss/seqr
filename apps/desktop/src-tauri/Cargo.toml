# Standalone workspace: keeps the GUI/Tauri toolchain isolated from the backend
# workspace at the repo root, while still depending on its crates by path.
[workspace]

[package]
name = "desktop"
version = "0.1.0"
description = "Seqr — secure E2E P2P chat"
authors = ["Seqr"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin on Windows.
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"

# Seqr shared crates (path deps; the desktop crate is intentionally outside the
# backend workspace so the GUI toolchain stays isolated).
seqr-crypto = { path = "../../../crates/seqr-crypto" }
seqr-protocol = { path = "../../../crates/seqr-protocol" }

# P2P transport: direct hole-punched QUIC with relay fallback.
iroh = "=0.92"

# Mailbox HTTPS client. rustls backend so we can pin the self-signed mailbox cert
# (no system/CA roots — only the pinned cert is trusted).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
