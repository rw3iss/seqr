# Standalone workspace: keeps the GUI/Tauri toolchain isolated from the backend
# workspace at the repo root, while still depending on its crates by path.
[workspace]

[package]
name = "desktop"
version = "0.1.0"
description = "Seqr — secure E2E P2P chat"
authors = ["Seqr"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin on Windows.
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
base64 = "0.22"

# Seqr shared crates (path deps; the desktop crate is intentionally outside the
# backend workspace so the GUI toolchain stays isolated).
seqr-crypto = { path = "../../../crates/seqr-crypto" }
seqr-protocol = { path = "../../../crates/seqr-protocol" }

# P2P transport: direct hole-punched QUIC with relay fallback.
iroh = "=0.92"

# Mailbox HTTPS client. rustls backend so we can pin the self-signed mailbox cert
# (no system/CA roots — only the pinned cert is trusted).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }

# Matrix backend — the alternative to the P2P stack above. Both are compiled in; the
# active one is chosen at runtime from config (`backend = "matrix" | "p2p"`). Defaults
# give e2e-encryption + automatic-room-key-forwarding + sqlite; bundled-sqlite ships the
# C lib (no system dep, easier cross-platform); markdown for formatted sends.
matrix-sdk = { version = "0.18", features = ["bundled-sqlite", "markdown"] }
# Random passphrase for the Matrix store encryption (single-version, already in the tree).
getrandom = "0.2"
# MIME detection for Matrix media uploads.
mime = "0.3"
mime_guess = "2"
# Stream combinators for driving the SAS verification state streams.
futures-util = "0.3"
# Diagnostics: route matrix-sdk/reqwest tracing to stdout (→ Android logcat).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pin the rustls crypto provider: the tree compiles in BOTH aws-lc-rs (reqwest/matrix-sdk)
# and ring (iroh), so rustls 0.23 can't auto-select and panics on first TLS use. We install
# aws-lc-rs as the process default at startup.
rustls = { version = "0.23", features = ["aws_lc_rs"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
