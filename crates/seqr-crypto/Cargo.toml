[package]
name = "seqr-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true

# Seqr cryptographic core.
#
# Pure, stateless primitives only. No I/O, no global state, no logging of secrets.
# Every function is deterministic given its inputs (except where a CSPRNG nonce/key
# is generated, which is called out explicitly). This is the ONLY crate permitted to
# perform encryption, signing, or key derivation — see the spec's DRY guarantees.

[dependencies]
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
thiserror.workspace = true

[dev-dependencies]
hex = "0.4"
