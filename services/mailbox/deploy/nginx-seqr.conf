# Seqr mailbox TLS terminator. Self-signed cert; the client pins it (no CA trust).
# Proxies to the mailbox bound on localhost.
server {
    listen __TLS_PORT__ ssl;
    listen [::]:__TLS_PORT__ ssl;
    server_name _;

    ssl_certificate     /etc/seqr-mailbox/tls/cert.pem;
    ssl_certificate_key /etc/seqr-mailbox/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Must exceed one hex-encoded attachment chunk (~1.05 MB); 4m gives headroom.
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
